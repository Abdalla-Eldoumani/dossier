name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm

      # npm honours the package-lock.json verbatim, including the platform-
      # specific optional dependencies it recorded at lockfile-generation time.
      # When the lockfile was generated on Windows, npm skips the Linux native
      # binding for vitest 4's rolldown bundler (see npm/cli#4828) and the test
      # step blows up with `Cannot find module '@rolldown/binding-linux-x64-gnu'`.
      # The npm install runs first; the second step then forces the matching
      # Linux binding into node_modules, reading the rolldown version dynamically
      # so the workaround stays correct as the dep gets bumped.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install rolldown native binding for Linux (npm/cli#4828 workaround)
        run: |
          ROLLDOWN_VERSION=$(node -p "require('./node_modules/rolldown/package.json').version")
          npm install --no-save --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}"

      # @dossier/core is consumed by both apps via its compiled `dist/index.d.ts`.
      # On a fresh checkout that file doesn't exist yet, so typecheck and lint of
      # the dependent workspaces fail with "Cannot find module '@dossier/core'".
      # Build core up front to materialise the type entry point, then run the
      # repo-wide checks.
      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build web app static export
        run: npm run build --workspace=apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build MCP server
        run: npm run build --workspace=apps/mcp-server

      - name: Verify MCP server end-to-end
        run: node apps/mcp-server/scripts/verify-stdio.mjs

      - name: Upload web static export
        uses: actions/upload-artifact@v4
        with:
          name: web-static-export
          path: apps/web/out
          if-no-files-found: error
          retention-days: 7
